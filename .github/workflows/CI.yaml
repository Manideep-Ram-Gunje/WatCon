name: CI

# The ConSurf integration lives on `consurf-integration`; this fork's `main` is
# a clean mirror of upstream. Testing only `main` would test upstream's code and
# never this work, which is what the inherited configuration did.
on:
  # Lets the workflow be started by hand from the Actions tab, which is the
  # only way to get a first run after enabling Actions on a fork -- enabling
  # them does not retroactively trigger anything.
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "consurf-integration"
  pull_request:
    branches:
      - "main"
      - "consurf-integration"
  schedule:
    - cron: "0 0 * * 0"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install from the package metadata rather than a separate conda
      # environment file. pyproject.toml now declares every runtime dependency,
      # so this exercises exactly what `pip install` gives a real user -- the
      # previous configuration installed with --no-deps into an environment that
      # contained none of them, and so could never have passed.
      - name: Install the package as a user would
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Show what was resolved
        shell: bash
        run: python -m pip list

      - name: Run the test suite
        shell: bash
        run: python -m pytest WatCon/tests/ -v --color=yes

      # The strongest smoke test available: the documented one-command entry
      # point, on the data shipped inside the wheel. It fails if the console
      # script is missing, if package data did not ship, or if any stage of the
      # pipeline breaks on this platform.
      - name: Run the bundled demo end to end
        shell: bash
        run: |
          watcon --version
          watcon demo --out-dir ci_demo

      - name: Check the demo actually produced results
        shell: bash
        run: |
          python - <<'PY'
          import csv, sys, pathlib
          rows = list(csv.DictReader(open("ci_demo/conservation.csv")))
          scored = [r for r in rows if r["evo_mean_score"] != "NA"]
          print("sites: %d, of which scored: %d" % (len(rows), len(scored)))
          assert len(rows) > 100, "too few sites -- pipeline degraded"
          assert len(scored) > 50, "conservation did not reach the sites"
          assert pathlib.Path("ci_demo/pymol/conserved_sites.pdb").is_file()
          assert pathlib.Path("ci_demo/preparation.csv").is_file()
          PY

  plugin:
    # PyMOL is an optional dependency -- `pip install watcon-consurf` must not
    # drag it in -- so the matrix above cannot cover the plugin, and its 28
    # tests skipped in every job. This one installs PyMOL from conda-forge and
    # runs them, which is the only CI protection the plugin has.
    name: PyMOL plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge
          conda-remove-defaults: true

      - name: Install PyMOL and the package
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge pymol-open-source
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Confirm PyMOL and Qt are importable
        shell: bash -el {0}
        run: |
          python -c "import pymol; print('pymol', pymol.__file__)"
          python -c "from pymol.Qt import QtWidgets; print('Qt bindings present')"

      # Qt needs a display even for offscreen widget construction.
      - name: Run the plugin tests
        shell: bash -el {0}
        env:
          QT_QPA_PLATFORM: offscreen
          PYMOL_QUIET: "1"
        run: |
          xvfb-run -a python -m pytest WatCon/tests/test_plugin.py WatCon/tests/test_plugin_family.py -v --color=yes

      # A skipped run is not a passing run. The whole point of this job is that
      # these tests execute, so fail if PyMOL was not found and they skipped.
      - name: Fail if the plugin tests were skipped
        shell: bash -el {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python -m pytest WatCon/tests/test_plugin.py WatCon/tests/test_plugin_family.py -q --no-header -rs 2>&1 | tee result.txt
          if grep -q "skipped" result.txt; then
            echo "Plugin tests skipped -- PyMOL/Qt did not import in this job."
            exit 1
          fi

  build:
    name: Wheel contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # Data files have been silently missing from this package before. Assert
      # what must be inside the wheel, and what must not.
      - name: Verify what ships
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          def count(part): return sum(1 for n in names if part in n)

          examples = count("data/examples/barnase/structures")
          fixtures = count("data/consurf/fixtures")
          bundles  = count("data/consurf/exploratory")
          print("examples=%d fixtures=%d exploratory=%d" % (examples, fixtures, bundles))

          assert examples >= 6, "the demo dataset did not ship"
          assert fixtures >= 5, "ConSurf fixtures did not ship"
          assert bundles == 0, "5 MB of raw research bundles leaked into the wheel"
          assert any(n.endswith("entry_points.txt") for n in names), "no console script"
          for module in ("cli.py", "prepare.py", "demo.py", "superpose.py",
                         "evolutionary.py", "residue_index.py",
                         "family.py", "alignment.py", "scene.py",
                         "structure_io.py", "fetch.py", "conformers.py"):
              assert any(n.endswith("/" + module) for n in names), module

          # The ensemble and family fixtures the newer tests need.
          assert count("data/examples/ptp1b_ensemble") >= 3, "ensemble fixtures missing"
          assert count("data/examples/ptp_family") >= 20, "family fixtures missing"

          # The vendored study is repository documentation, not package data.
          assert count("experiments/") == 0, "experiments/ leaked into the wheel"
          PY

      # Every other job runs the suite from a checkout, so none of them can see
      # what an *installed* copy does. That blind spot hid 89 collection errors
      # and 41 failures from `pytest --pyargs WatCon.tests`, because ten modules
      # need inputs a distribution deliberately does not carry. Install the
      # wheel somewhere with no source tree and run what actually shipped.
      - name: Run the shipped test suite from an installed wheel
        run: |
          python -m venv /tmp/installed
          /tmp/installed/bin/python -m pip install --upgrade pip
          /tmp/installed/bin/python -m pip install "$(ls dist/*.whl)" pytest
          cd /tmp
          /tmp/installed/bin/python -m pytest --pyargs WatCon.tests -q
